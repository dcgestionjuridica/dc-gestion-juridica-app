<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>DC Gestión Jurídica</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1a36;color:#d8b04a;font-family:system-ui,sans-serif;text-align:center;padding:24px}p{color:#cfd6e6;max-width:340px}</style></head>
<body><div><h2 style="margin:0 0 8px">DC Gestión Jurídica</h2><p id="m">Abriendo su acceso…</p></div>
<script>
(function(){var c=new URLSearchParams(location.search).get("c")||"";
var m=document.getElementById("m");
if(!c){m.textContent="Enlace incompleto. Pida uno nuevo.";return;}
fetch("https://okvxxppudwbcldxpxyfw.supabase.co/functions/v1/enlace-corto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({operacion:"resolver",c:c})})
.then(function(r){return r.json()}).then(function(j){if(j&&j.url){location.replace(j.url)}else{m.textContent=(j&&j.error)||"No se pudo abrir el enlace."}})
.catch(function(){m.textContent="No se pudo abrir el enlace. Revise su conexión."});})();
</script></body></html>
